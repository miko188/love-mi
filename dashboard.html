<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Главная панель — LogiCore</title>
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<!-- ЯДРО -->
<script src="../js/data/storage.js"></script>
<script src="../js/core/notifications.js"></script>
<script src="../js/core/auth.js"></script>
<script src="../js/core/permissions.js"></script>
<script src="../js/core/navigation.js"></script>
<script src="../js/data/seed.js"></script>
<script src="../js/data/backup.js"></script>
<script src="../js/ui/modal.js"></script>
<script src="../js/ui/table.js"></script>
<script src="../js/ui/forms.js"></script>
<script src="../js/ui/filters.js"></script>
<script src="../js/ui/sidebar.js"></script>
<script src="../js/ui/header.js"></script>
<!-- МОДУЛИ (единый источник истины) -->
<script src="../js/modules/products.js"></script>
<script src="../js/modules/warehouse.js"></script>
<script src="../js/modules/inventory.js"></script>
<script src="../js/modules/receiving.js"></script>
<script src="../js/modules/shipping.js"></script>
<script src="../js/modules/orders.js"></script>
<script src="../js/modules/transport.js"></script>
<script src="../js/modules/routes.js"></script>
<script src="../js/modules/suppliers.js"></script>
<script src="../js/modules/finance.js"></script>
<script src="../js/modules/employees.js"></script>
<script src="../js/modules/reports.js"></script>
<!-- APP -->
<script src="../js/core/app.js"></script>
<script>
(function(){
  'use strict';

  var content = App.initLayout('dashboard','Главная панель');
  if (!content) return;

  // === ЕДИНЫЙ СБОР ДАННЫХ ЧЕРЕЗ МОДУЛИ ===
  function collect(){
    var products   = Products.all();
    var inventory  = Inventory.all();
    var warehouses = Warehouse.all();
    var orders     = Orders.all();
    var receiving  = Receiving.all();
    var shipping   = Shipping.all();
    var transport  = Transport.all();
    var drivers    = Transport.drivers();
    var routes     = Routes.all();
    var finance    = Finance.all();
    var suppliers  = Suppliers.all();

    // --- KPI: склады ---
    var totalStockQty = inventory.reduce(function(s,i){return s+(Number(i.qty)||0);},0);
    var totalStockValue = inventory.reduce(function(s,i){
      var p = Products.find(i.productId);
      return s + (p ? (Number(p.cost)||0) * (Number(i.qty)||0) : 0);
    },0);

    // --- KPI: заказы ---
    var ordersInWork   = orders.filter(function(o){return ['new','confirmed','collecting','ready'].indexOf(o.status)!==-1;}).length;
    var ordersInTransit= orders.filter(function(o){return o.status==='transit';}).length;
    var ordersDelivered= orders.filter(function(o){return o.status==='delivered';}).length;
    var ordersRevenue  = orders.filter(function(o){return o.status!=='cancelled';})
      .reduce(function(s,o){return s + Orders.totalOf(o);},0);

    // --- KPI: приёмка/отгрузка ---
    var receivingPending = receiving.filter(function(r){return r.status==='pending';}).length;
    var receivingDone    = receiving.filter(function(r){return r.status==='completed';}).length;
    var shippingPending  = shipping.filter(function(r){return r.status==='pending';}).length;
    var shippingDone     = shipping.filter(function(r){return r.status==='completed';}).length;

    // --- KPI: транспорт ---
    var transportActive = transport.filter(function(t){return t.status==='active';}).length;
    var routesInTransit = routes.filter(function(r){return r.status==='in_transit';}).length;
    var routesPlanned   = routes.filter(function(r){return r.status==='planned';}).length;

    // --- KPI: финансы ---
    var fin = Finance.totals();

    return {
      products:products, inventory:inventory, warehouses:warehouses,
      orders:orders, receiving:receiving, shipping:shipping,
      transport:transport, drivers:drivers, routes:routes,
      finance:finance, suppliers:suppliers,
      totalStockQty:totalStockQty, totalStockValue:totalStockValue,
      ordersInWork:ordersInWork, ordersInTransit:ordersInTransit,
      ordersDelivered:ordersDelivered, ordersRevenue:ordersRevenue,
      receivingPending:receivingPending, receivingDone:receivingDone,
      shippingPending:shippingPending, shippingDone:shippingDone,
      transportActive:transportActive,
      routesInTransit:routesInTransit, routesPlanned:routesPlanned,
      fin:fin
    };
  }

  // === РЕНДЕР СТРАНИЦЫ ===
  var data = collect();

  content.innerHTML =
    '<div class="page-head">' +
      '<div><h2>Главная панель</h2><p>Сводка по складу, логистике и компании в реальном времени.</p></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn--ghost" id="btnRefresh">↻ Обновить</button>' +
        '<button class="btn btn--ghost" id="btnBackup">Экспорт JSON</button>' +
        '<a class="btn btn--primary" href="' + Navigation.href('orders') + '">+ Заказ</a>' +
      '</div>' +
    '</div>' +

    // === KPI ROW 1 — СКЛАД ===
    '<div class="kpi-grid">' +
      kpi('blue','Товары на складе', data.totalStockQty, data.products.length+' позиций', 'box') +
      kpi('cyan','Стоимость склада', Storage.money(data.totalStockValue), 'по закупочным ценам', 'money') +
      kpi('purple','Склады', data.warehouses.length, Warehouse.all().reduce(function(s,w){return s+Warehouse.cellsOf(w.id).length;},0)+' ячеек', 'wh') +
      kpi('orange','Ожидают приёмки', data.receivingPending, data.receivingDone+' завершено', 'down') +
    '</div>' +

    // === KPI ROW 2 — ЛОГИСТИКА ===
    '<div class="kpi-grid">' +
      kpi('green','Заказы в работе', data.ordersInWork, data.orders.length+' всего', 'cart') +
      kpi('orange','В пути', data.routesInTransit, data.routesPlanned+' запланировано', 'truck') +
      kpi('cyan','Доставлено заказов', data.ordersDelivered, 'за всё время', 'check') +
      kpi('red','Расходы', Storage.money(data.fin.expense), 'баланс: '+Storage.money(data.fin.balance), 'fuel') +
    '</div>' +

    // === ГРАФИКИ ===
    '<div class="dash-grid">' +
      '<div class="card"><div class="card__head"><h3>Заказы по месяцам</h3><span class="badge badge--blue">6 мес.</span></div><div class="card__body" id="chartMonths"></div></div>' +
      '<div class="card"><div class="card__head"><h3>Статусы заказов</h3></div><div class="card__body" id="chartStatus"></div></div>' +
    '</div>' +

    // === ТОП ТОВАРЫ + ПОСЛЕДНИЕ ОПЕРАЦИИ ===
    '<div class="dash-grid">' +
      '<div class="card"><div class="card__head"><h3>Топ-5 товаров по остаткам</h3></div><div class="card__body" id="topProducts"></div></div>' +
      '<div class="card"><div class="card__head"><h3>Последние операции</h3></div><div class="card__body"><div class="dash-list" id="recentOps"></div></div></div>' +
    '</div>' +

    // === НИЗКИЕ ОСТАТКИ + ФИНАНСЫ ПО КАТЕГОРИЯМ ===
    '<div class="dash-grid">' +
      '<div class="card"><div class="card__head"><h3>Низкие остатки</h3><a class="badge badge--red" href="' + Navigation.href('inventory') + '">Все</a></div><div class="card__body"><div class="dash-list" id="lowStock"></div></div></div>' +
      '<div class="card"><div class="card__head"><h3>Расходы по категориям</h3></div><div class="card__body" id="finCategories"></div></div>' +
    '</div>';

  // ============================================================
  // 1. KPI helper
  // ============================================================
  function ico(name){
    var map = {
      box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
      cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/>',
      down:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
      truck:'<path d="M1 3h15v13H1zM16 8h4l3 3v5h-7"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
      wh:'<path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/>',
      fuel:'<path d="M3 22h12V4H3zM15 10h4l3 3v9h-7M7 8h4"/>',
      check:'<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/>',
      money:'<path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>'
    };
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(map[name]||'')+'</svg>';
  }
  function kpi(color,label,value,sub,icon){
    return '<div class="kpi kpi--'+color+'"><div class="kpi__head"><span class="kpi__label">'+label+'</span><div class="kpi__icon">'+ico(icon)+'</div></div><div class="kpi__value">'+value+'</div><div class="kpi__sub">'+sub+'</div></div>';
  }

  // ============================================================
  // 2. График: заказы по месяцам (реальные createdAt)
  // ============================================================
  (function(){
    var months = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
    var now = new Date();
    var labels = [], newCounts = [], doneCounts = [];
    for (var i=5;i>=0;i--){
      var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      var m = d.getMonth(), y = d.getFullYear();
      labels.push(months[m]);
      var created = data.orders.filter(function(o){
        var od = new Date(o.createdAt);
        return od.getMonth()===m && od.getFullYear()===y;
      }).length;
      var done = data.orders.filter(function(o){
        if (o.status!=='delivered') return false;
        var od = new Date(o.createdAt);
        return od.getMonth()===m && od.getFullYear()===y;
      }).length;
      newCounts.push(created);
      doneCounts.push(done);
    }
    var max = Math.max(1, Math.max.apply(null, newCounts.concat(doneCounts)));
    var html = '<div class="bar-chart">' + labels.map(function(l,idx){
      var h1 = Math.max(4, Math.round((newCounts[idx]/max)*100));
      var h2 = Math.max(4, Math.round((doneCounts[idx]/max)*100));
      return '<div class="bar-chart__col"><div class="bar-chart__bars">' +
        '<div class="bar-chart__bar" style="height:'+h1+'%" title="Создано: '+newCounts[idx]+'"></div>' +
        '<div class="bar-chart__bar bar-chart__bar--green" style="height:'+h2+'%" title="Доставлено: '+doneCounts[idx]+'"></div>' +
        '</div><span class="bar-chart__label">'+l+'</span></div>';
    }).join('') + '</div>' +
    '<div style="display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:12px;color:var(--text-muted)">' +
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c-primary);margin-right:5px"></span>Создано</span>' +
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c-success);margin-right:5px"></span>Доставлено</span>' +
    '</div>';
    document.getElementById('chartMonths').innerHTML = html;
  })();

  // ============================================================
  // 3. Пирог: статусы заказов (реальные)
  // ============================================================
  (function(){
    var colors = { new:'#2563eb', confirmed:'#0ea5e9', collecting:'#f59e0b', ready:'#8b5cf6',
      shipped:'#06b6d4', transit:'#f97316', delivered:'#10b981', cancelled:'#ef4444' };
    var counts = {};
    data.orders.forEach(function(o){ counts[o.status] = (counts[o.status]||0)+1; });
    var total = data.orders.length || 1;
    var acc = 0, stops = [];
    Object.keys(counts).forEach(function(k){
      var part = counts[k]/total*100;
      stops.push(colors[k] + ' ' + acc.toFixed(2) + '% ' + (acc+part).toFixed(2) + '%');
      acc += part;
    });
    var bg = stops.length ? 'conic-gradient(' + stops.join(',') + ')' : 'var(--bg-muted)';
    var legend = Object.keys(counts).length
      ? Object.keys(counts).map(function(k){
          return '<div class="legend-item"><span class="legend-dot" style="background:'+colors[k]+'"></span><span>'+(Orders.STATUS_LABELS[k]||k)+'</span><span>'+counts[k]+'</span></div>';
        }).join('')
      : '<p style="color:var(--text-muted);font-size:13px">Заказов пока нет.</p>';
    document.getElementById('chartStatus').innerHTML =
      '<div class="pie" style="background:'+bg+'"><div class="pie-center"><div><strong>'+data.orders.length+'</strong><span>заказов</span></div></div></div>' +
      '<div class="legend">' + legend + '</div>';
  })();

  // ============================================================
  // 4. Топ-5 товаров по остаткам (реальные)
  // ============================================================
  (function(){
    var rows = data.products.map(function(p){
      return { p:p, qty: Inventory.totalFor(p.id) };
    }).sort(function(a,b){return b.qty-a.qty;}).slice(0,5);
    if (!rows.length){
      document.getElementById('topProducts').innerHTML = '<div class="empty"><h4>Товаров нет</h4></div>';
      return;
    }
    var max = rows[0].qty || 1;
    document.getElementById('topProducts').innerHTML = rows.map(function(r){
      var pct = Math.round(r.qty/max*100);
      return '<div class="dash-list__item" style="align-items:flex-start;flex-direction:column;gap:6px">' +
        '<div style="display:flex;justify-content:space-between;width:100%"><strong>'+Table.escapeHtml(r.p.name)+'</strong><span style="font-weight:700">'+r.qty+' '+r.p.unit+'</span></div>' +
        '<div class="progress" style="width:100%"><div class="progress__bar" style="width:'+pct+'%"></div></div>' +
      '</div>';
    }).join('');
  })();

  // ============================================================
  // 5. Последние операции (реальные документы, а не логи)
  // ============================================================
  (function(){
    var ops = [];

    data.receiving.forEach(function(r){
      var sup = Suppliers.find(r.supplierId);
      ops.push({
        type:'receiving',
        title:'Приёмка '+r.number,
        desc:(sup?sup.name:'—')+' · '+((r.items||[]).length)+' поз.',
        at: r.completedAt || r.createdAt,
        color:'#10b981',
        icon:'↓'
      });
    });
    data.shipping.forEach(function(s){
      var ord = s.orderId ? Orders.find(s.orderId) : null;
      ops.push({
        type:'shipping',
        title:'Отгрузка '+s.number,
        desc:(ord?'Заказ '+ord.number+' · ':'')+((s.items||[]).length)+' поз.',
        at: s.completedAt || s.createdAt,
        color:'#06b6d4',
        icon:'↑'
      });
    });
    data.orders.forEach(function(o){
      ops.push({
        type:'order',
        title:'Заказ '+o.number,
        desc:o.customer+' · '+Storage.money(Orders.totalOf(o)),
        at: o.createdAt,
        color:'#2563eb',
        icon:'🛒'
      });
    });
    data.routes.forEach(function(r){
      ops.push({
        type:'route',
        title:'Рейс '+r.number,
        desc:r.from+' → '+r.to+' · '+(Routes.STATUS[r.status]||r.status),
        at: r.createdAt || r.departureDate,
        color:'#f97316',
        icon:'🚚'
      });
    });
    data.finance.forEach(function(f){
      ops.push({
        type:'finance',
        title:(f.type==='income'?'Доход':'Расход')+' · '+f.category,
        desc:f.description || Storage.money(f.amount),
        at: f.createdAt || f.date,
        color: f.type==='income'?'#10b981':'#ef4444',
        icon: f.type==='income'?'+':'−'
      });
    });

    ops = ops.filter(function(o){return o.at;})
      .sort(function(a,b){return new Date(b.at)-new Date(a.at);})
      .slice(0,7);

    if (!ops.length){
      document.getElementById('recentOps').innerHTML =
        '<div class="empty"><h4>Пока нет операций</h4><p>Создайте заказ или приёмку — операции появятся здесь.</p></div>';
      return;
    }

    document.getElementById('recentOps').innerHTML = ops.map(function(o){
      return '<div class="dash-list__item">' +
        '<div class="dash-list__icon" style="background:'+o.color+';color:#fff;font-weight:700">'+o.icon+'</div>' +
        '<div class="dash-list__body"><strong>'+Table.escapeHtml(o.title)+'</strong><span>'+Table.escapeHtml(o.desc)+'</span></div>' +
        '<div class="dash-list__time">'+Storage.formatDateTime(o.at)+'</div>' +
      '</div>';
    }).join('');
  })();

  // ============================================================
  // 6. Низкие остатки (реальные с дефицитом)
  // ============================================================
  (function(){
    var low = [];
    data.products.forEach(function(p){
      var qty = Inventory.totalFor(p.id);
      var min = Number(p.minQty)||0;
      if (qty < min) low.push({ p:p, qty:qty, min:min, deficit: min-qty });
    });
    low.sort(function(a,b){return b.deficit-a.deficit;});

    if (!low.length){
      document.getElementById('lowStock').innerHTML =
        '<div class="empty"><h4>Все в норме</h4><p>Товаров с низким остатком нет.</p></div>';
      return;
    }

    document.getElementById('lowStock').innerHTML = low.slice(0,6).map(function(x){
      return '<div class="dash-list__item">' +
        '<div class="dash-list__icon" style="background:#fee2e2;color:#b91c1c">!</div>' +
        '<div class="dash-list__body"><strong>'+Table.escapeHtml(x.p.name)+'</strong>' +
          '<span>Остаток: '+x.qty+' / мин. '+x.min+' · <b style="color:var(--c-danger)">не хватает '+x.deficit+'</b></span></div>' +
      '</div>';
    }).join('');
  })();

  // ============================================================
  // 7. Расходы по категориям (реальные)
  // ============================================================
  (function(){
    var map = Finance.byCategory('expense');
    var keys = Object.keys(map);
    if (!keys.length){
      document.getElementById('finCategories').innerHTML =
        '<div class="empty"><h4>Расходов нет</h4></div>';
      return;
    }
    var total = keys.reduce(function(s,k){return s+map[k];},0) || 1;
    var palette = ['#2563eb','#10b981','#f59e0b','#8b5cf6','#06b6d4','#ef4444'];
    document.getElementById('finCategories').innerHTML = keys.map(function(k,i){
      var pct = Math.round(map[k]/total*100);
      var color = palette[i % palette.length];
      return '<div style="margin-bottom:10px">' +
        '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">' +
          '<span>'+Table.escapeHtml(k)+'</span>' +
          '<strong>'+Storage.money(map[k])+' ('+pct+'%)</strong>' +
        '</div>' +
        '<div class="progress"><div class="progress__bar" style="width:'+pct+'%;background:'+color+'"></div></div>' +
      '</div>';
    }).join('');
  })();

  // ============================================================
  // 8. Действия
  // ============================================================
  document.getElementById('btnRefresh').onclick = function(){
    Notifications.info('Обновление','Пересчёт данных…');
    setTimeout(function(){ location.reload(); }, 200);
  };
  document.getElementById('btnBackup').onclick = function(){ Backup.download(); };

  // Автообновление при возврате на вкладку
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) {
      // тихо перезагружаем данные, если открыта страница
      var fresh = collect();
      // простая проверка изменений
      var changed = fresh.orders.length !== data.orders.length ||
                    fresh.inventory.length !== data.inventory.length ||
                    fresh.receiving.length !== data.receiving.length ||
                    fresh.shipping.length !== data.shipping.length;
      if (changed) {
        Notifications.info('Данные обновлены','Обнаружены изменения в системе.');
        setTimeout(function(){ location.reload(); }, 400);
      }
    }
  });

})();
</script>
</body>
</html>
